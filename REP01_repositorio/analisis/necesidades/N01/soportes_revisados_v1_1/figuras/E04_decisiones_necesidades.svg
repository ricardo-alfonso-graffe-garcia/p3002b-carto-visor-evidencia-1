<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3137" viewBox="0 0 1500 3137" role="img"><title>Reponer lo conocido y explorar sin encargo</title><desc>Medida, experiencia de ventas, muestra, referencia y oferta bastaron. Información distribuida no fue déficit. Tacto no prueba uso posterior y más información no asegura compra si la cantidad sigue siendo excesiva para explorar.</desc><rect width="1500" height="3137" fill="#ffffff"/><text x="44" y="52" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#142f43" font-weight="700">E04 · Reponer lo conocido y explorar sin encargo</text><text x="44" y="89" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203340" font-weight="400">De la decisión y lo disponible al conocimiento necesario · N01 1.0</text><rect x="44" y="119" width="1412" height="166" rx="12" fill="#e7f2ed"/><text x="68" y="152" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">SUFICIENCIA Y LÍMITE DEL CASO</text><text x="68" y="187" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Medida, experiencia de ventas, muestra, referencia y oferta bastaron. Información distribuida no fue déficit.</text><text x="68" y="214" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Tacto no prueba uso posterior y más información no asegura compra si la cantidad sigue siendo excesiva para</text><text x="68" y="241" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">explorar.</text><text x="44" y="349" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N018 · Remanente y movimiento para decidir qué reponer</text><text x="44" y="391" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="411" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="444" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="479" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Mantenerlo en la lista de reposición o dejarlo para otra vuelta</text><rect x="44" y="539" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="572" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Vio bajar el rollo, midió lo restante y confirmó la</text><text x="68" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">necesidad; alcanzaba para atender mientras hacía la</text><text x="68" y="661" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">compra. Otros elásticos no estaban igual de bajos.</text><rect x="762.0" y="539" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="572" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No hay falta declarada para decidir la reposición de</text><text x="786.0" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">este rollo. La función de piezas poco vendidas es una</text><text x="786.0" y="661" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">variación general, no otra compra ocurrida.</text><text x="64" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="757" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="825" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cuánto queda del artículo, cómo se ha estado despachando y qué función cumple entre las alternativas del surtido</text><rect x="44" y="885" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="918" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K018</text><text x="68" y="953" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede explicar por qué ese rollo se repone ahora y otros no, diferenciando estimación inicial, medida y función</text><text x="68" y="980" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">sin umbral universal inventado.</text><text x="44" y="1064" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E04 · La reposición nació de revisar el rollo y debía decidirse aun sin la pregunta por</text><text x="44" y="1089" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">suavidad; habilita continuidad del artículo conocido.</text><text x="44" y="1127" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0183, N01-V0184, N01-V0185, N01-V0186, N01-V0187, N01-V0188, N01-V0189, N01-V0190, N01-V0191, N01-V0192,</text><text x="44" y="1150" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0193, N01-V0194, N01-V0195, N01-V0196, N01-V0197</text><path d="M44 1182 H1456" stroke="#c9d5dd"/><text x="44" y="1245" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N020 · Cantidad y conveniencia de incorporar una alternativa</text><text x="44" y="1287" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="1307" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="1340" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="1375" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Traerla para explorar o dejarla sin comprar, conservando la referencia</text><rect x="44" y="1435" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="1468" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="1503" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Tocó y estiró el material más suave; preguntó precio y</text><text x="68" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">presentación. La cantidad exigida era más de lo que</text><text x="68" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">quería para conocerlo y no lo adquirió.</text><rect x="762.0" y="1435" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="1468" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="1503" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">La consulta de condiciones se resolvió; idoneidad para</text><text x="786.0" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">la prenda y conveniencia de coexistencia quedaron sin</text><text x="786.0" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">resolver.</text><text x="64" y="1636" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="1636" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="1653" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="1686" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="1721" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué presentación y precio tiene la alternativa y qué se conoce o se desconoce de su utilidad para convivir con el</text><text x="68" y="1748" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">artículo actual</text><rect x="44" y="1808" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="1841" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K020</text><text x="68" y="1876" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede explicar no comprar por cantidad y conveniencia incierta, aunque la alternativa se sienta más suave, sin</text><text x="68" y="1903" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">afirmar un defecto o rechazo definitivo.</text><text x="44" y="1987" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad MEDIA · ámbito E04 · Era exploración adicional; la reposición era obligada para esta vuelta. La persona</text><text x="44" y="2012" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">separa ambos compromisos y decide cuándo cerrar la consulta.</text><text x="44" y="2050" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0210, N01-V0211, N01-V0212, N01-V0213, N01-V0214, N01-V0215, N01-V0216, N01-V0206, N01-V0208, N01-V0217</text><path d="M44 2082 H1456" stroke="#c9d5dd"/><text x="44" y="2145" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#6b4ca5" font-weight="700">N01-N023 · Desempeño comparado tras coser y usar el material</text><text x="44" y="2187" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6b4ca5" font-weight="700">DESEO_IDEAL · NO_APLICA_AL_IDEAL</text><rect x="44" y="2207" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="2240" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="2275" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Decidir si vale la pena probar una cantidad y explicar lo que sabe al comparar las opciones</text><rect x="44" y="2335" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="2368" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="2403" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Conoce el manejo del actual y observó tacto y</text><text x="68" y="2430" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">estiramiento del otro; tiene referencia de alternativa</text><text x="68" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">pero no pruebas posteriores disponibles.</text><rect x="762.0" y="2335" width="694.0" height="193" rx="12" fill="#f4eff9"/><text x="786.0" y="2368" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="2403" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Desea ver recuperación, enrollamiento o rigidez según</text><text x="786.0" y="2430" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">contexto; comparar el par del mismo ancho antes de</text><text x="786.0" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">comprar gran cantidad. Son preguntas, no defectos</text><text x="786.0" y="2484" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">constatados.</text><text x="64" y="2563" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><text x="782.0" y="2563" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><rect x="44" y="2580" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="2613" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="2648" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cómo se comportan el conocido y la alternativa tras coser y usar, qué se probó en qué contexto y de dónde viene</text><text x="68" y="2675" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">ese conocimiento</text><rect x="44" y="2735" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="2768" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K023</text><text x="68" y="2803" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede justificar probar o dejar la alternativa con un comportamiento conocido y contexto de prueba, y contrastarlo</text><text x="68" y="2830" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">luego con lo que encuentre al usar o vender.</text><text x="44" y="2914" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">Prioridad ALTA · ámbito E04 · En el ideal elige ver material conocido junto al otro y qué se comprobó; el análisis lo</text><text x="44" y="2939" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">prioriza dentro de la exploración material, sin desplazar reponer lo actual ni eliminar restricción de cantidad.</text><text x="44" y="2977" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0237, N01-V0238, N01-V0239, N01-V0240, N01-V0241, N01-V0242, N01-V0243, N01-V0244, N01-V0245, N01-V0246,</text><text x="44" y="3000" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0247, N01-V0248, N01-V0249, N01-V0250, N01-V0251, N01-V0252, N01-V0253, N01-V0254</text><path d="M44 3032 H1456" stroke="#c9d5dd"/><text x="44" y="3077" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Fuente: N01_necesidades_v1.json. Selección de decisiones; detalle y contraevidencia en JSON/CSV.</text><text x="44" y="3105" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Flechas = relación analítica. No son flujo de producto. Prioridad local; utilidad y aceptación no comprobadas.</text></svg>