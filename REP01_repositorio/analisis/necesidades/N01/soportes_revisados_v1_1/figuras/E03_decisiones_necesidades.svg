<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3983" viewBox="0 0 1500 3983" role="img"><title>Confirmar una serie y retomar la relación</title><desc>Notas y conversación bastaron. Salón/equipo/fechas y recepción acordados permiten anunciar sin asistencia exacta ni lectura cerrada. Mejorar comunicación de autonomía no equivale a fallo del horario o salón.</desc><rect width="1500" height="3983" fill="#ffffff"/><text x="44" y="52" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#142f43" font-weight="700">E03 · Confirmar una serie y retomar la relación</text><text x="44" y="89" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203340" font-weight="400">De la decisión y lo disponible al conocimiento necesario · N01 1.0</text><rect x="44" y="119" width="1412" height="139" rx="12" fill="#e7f2ed"/><text x="68" y="152" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">SUFICIENCIA Y LÍMITE DEL CASO</text><text x="68" y="187" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Notas y conversación bastaron. Salón/equipo/fechas y recepción acordados permiten anunciar sin asistencia exacta</text><text x="68" y="214" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">ni lectura cerrada. Mejorar comunicación de autonomía no equivale a fallo del horario o salón.</text><text x="44" y="322" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N010 · Compromisos compartidos que permiten anunciar la serie</text><text x="44" y="364" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="384" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="417" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="452" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Elegir una propuesta realizable y decidir anunciarla dentro de su función de coordinación</text><rect x="44" y="512" width="694.0" height="193" rx="12" fill="#edf3f6"/><text x="68" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Cruzó agendas, habló con mediadora y programación,</text><text x="68" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">consultó parcialmente horarios y recibió confirmación</text><text x="68" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">de anfitriones. Mantuvo tres encuentros en vez de</text><text x="68" y="661" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">sumar otro sin acuerdo.</text><rect x="762.0" y="512" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No faltó un dato indispensable para invitar;</text><text x="786.0" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">asistencia exacta y elección final de lecturas podían</text><text x="786.0" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">permanecer abiertas.</text><text x="64" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="757" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="825" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">si el salón está confirmado en las tres fechas, el equipo puede sostenerlas y hay personas interesadas para</text><text x="68" y="852" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">quienes el horario es posible</text><rect x="44" y="912" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="945" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K010</text><text x="68" y="980" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede distinguir posibilidades, confirmaciones y pendientes, y explicar por qué ya se puede cumplir lo que dice la</text><text x="68" y="1007" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">invitación.</text><text x="44" y="1091" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E03 · Es la condición explícita para circular la invitación y sostener continuidad. La</text><text x="44" y="1116" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">suficiencia se define por poder cumplir la serie, no por conocer a toda la zona.</text><text x="44" y="1154" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0099, N01-V0100, N01-V0101, N01-V0102, N01-V0103, N01-V0104, N01-V0105, N01-V0106, N01-V0107, N01-V0108,</text><text x="44" y="1177" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0109, N01-V0110, N01-V0111, N01-V0112, N01-V0113</text><path d="M44 1209 H1456" stroke="#c9d5dd"/><text x="44" y="1272" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N013 · Alcance de la participación y autonomía de cada sesión</text><text x="44" y="1314" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · PARCIAL_DECLARADA</text><rect x="44" y="1334" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="1367" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="1402" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Explicar la invitación y recepción sin imponer tareas o continuidad de asistencia</text><rect x="44" y="1462" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="1495" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Se corrigió lenguaje que parecía taller con entrega;</text><text x="68" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">una pregunta individual motivó aclarar escuchar y</text><text x="68" y="1584" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">escritura optativa al inicio de siguientes encuentros.</text><rect x="762.0" y="1462" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="1495" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">La coordinadora haría más explícita la autonomía desde</text><text x="786.0" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">la invitación y la recepción; no está segura de que</text><text x="786.0" y="1584" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">fuera entendida igual desde fuera.</text><text x="64" y="1663" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="1663" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="1680" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="1713" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="1748" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué se ofrece, que escuchar basta, escribir es optativo y cada encuentro puede disfrutarse sin haber asistido</text><text x="68" y="1775" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">antes</text><rect x="44" y="1835" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="1868" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K013</text><text x="68" y="1903" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">La explicación permite distinguir serie relacionada de asistencia obligatoria y escritura invitada de entrega</text><text x="68" y="1930" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">exigida; no presenta una pregunta como confusión de todos.</text><text x="44" y="2014" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E03 · La duda relatada cambió la explicación posterior y la coordinadora identifica una</text><text x="44" y="2039" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">mejora aún deseada para la invitación; afecta poder entrar y volver sin requisito inexistente.</text><text x="44" y="2077" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0136, N01-V0130, N01-V0137, N01-V0138, N01-V0139, N01-V0140, N01-V0141, N01-V0142, N01-V0143, N01-V0144</text><path d="M44 2109 H1456" stroke="#c9d5dd"/><text x="44" y="2172" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#6b4ca5" font-weight="700">N01-N016 · Acuerdos e interlocución recuperables al retomar el espacio</text><text x="44" y="2214" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6b4ca5" font-weight="700">DESEO_IDEAL · NO_APLICA_AL_IDEAL</text><rect x="44" y="2234" width="1412" height="139" rx="12" fill="#edf3f6"/><text x="68" y="2267" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="2302" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Preparar otro acercamiento o permitir que otra persona del equipo retome la relación sin depender de memoria oral</text><text x="68" y="2329" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">completa</text><rect x="44" y="2389" width="694.0" height="139" rx="12" fill="#edf3f6"/><text x="68" y="2422" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Notas, mensajes y calendario bastaron para la serie;</text><text x="68" y="2484" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">hubo recuperación puntual de un mensaje de horario.</text><rect x="762.0" y="2389" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="2422" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Desea memoria por espacio que separe lo dicho antes y</text><text x="786.0" y="2484" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">notas propias posteriores, empezando por acuerdos</text><text x="786.0" y="2511" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">prácticos y preguntas.</text><text x="64" y="2590" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><text x="782.0" y="2590" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><rect x="44" y="2607" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="2640" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="2675" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">con quién se habló, qué se confirmó, qué ocurrió y qué debe volver a preguntarse</text><rect x="44" y="2735" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="2768" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K016</text><text x="68" y="2803" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Otra persona del equipo puede preparar el acercamiento y distinguir lo que se sabe de lo que debe confirmar, sin</text><text x="68" y="2830" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">pedir toda la historia desde cero.</text><text x="44" y="2914" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">Prioridad ALTA · ámbito E03 · La coordinadora prioriza acuerdos prácticos y qué volver a preguntar; el análisis la</text><text x="44" y="2939" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">coloca antes de enriquecer ritmos de uso dentro del ideal, condicionada a relevo efectivo.</text><text x="44" y="2977" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0111, N01-V0112, N01-V0165, N01-V0166, N01-V0167, N01-V0168, N01-V0169, N01-V0170, N01-V0171, N01-V0172,</text><text x="44" y="3000" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0173, N01-V0174</text><path d="M44 3032 H1456" stroke="#c9d5dd"/><text x="44" y="3095" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#6b4ca5" font-weight="700">N01-N017 · Ritmos de uso para orientar otra propuesta cultural</text><text x="44" y="3137" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6b4ca5" font-weight="700">DESEO_IDEAL · NO_APLICA_AL_IDEAL</text><rect x="44" y="3157" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="3190" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="3225" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Elegir si proponer encuentros prolongados, entradas breves o continuidad semanal y preparar mejores preguntas</text><rect x="44" y="3285" width="694.0" height="139" rx="12" fill="#edf3f6"/><text x="68" y="3318" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="3353" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">En este lugar obtuvieron lo necesario conversando y</text><text x="68" y="3380" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">visitando; no sintió faltar algo indispensable.</text><rect x="762.0" y="3285" width="694.0" height="139" rx="12" fill="#f4eff9"/><text x="786.0" y="3318" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="3353" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Desea una primera idea de ritmos en lugares nuevos,</text><text x="786.0" y="3380" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">contada por quienes los conocen, con fuente y ocasión.</text><text x="64" y="3459" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><text x="782.0" y="3459" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><rect x="44" y="3476" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="3509" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="3544" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cómo se vive cada horario, si se llega de paso o con tiempo y cómo otras actividades dan movimiento al lugar</text><rect x="44" y="3604" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="3637" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K017</text><text x="68" y="3672" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">La referencia permite formular una propuesta y preguntas pertinentes sobre duración y forma de sumarse, y deja</text><text x="68" y="3699" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">explícito qué habrá que confirmar.</text><text x="44" y="3783" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">Prioridad MEDIA · ámbito E03 · Puede orientar un lugar nuevo, pero la prioridad expresada empieza por acuerdos</text><text x="44" y="3808" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">prácticos; no hubo carencia indispensable en la serie actual.</text><text x="44" y="3846" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0178, N01-V0179, N01-V0180, N01-V0181, N01-V0182</text><path d="M44 3878 H1456" stroke="#c9d5dd"/><text x="44" y="3923" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Fuente: N01_necesidades_v1.json. Selección de decisiones; detalle y contraevidencia en JSON/CSV.</text><text x="44" y="3951" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Flechas = relación analítica. No son flujo de producto. Prioridad local; utilidad y aceptación no comprobadas.</text></svg>