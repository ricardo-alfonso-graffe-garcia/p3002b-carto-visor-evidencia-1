<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3133" viewBox="0 0 1500 3133" role="img"><title>Acordar lo necesario y decidir en destino</title><desc>Sabía lo necesario para empezar; desconocer libro y segunda parada era parte del propósito y acuerdo. La tarde funcionó mirando y preguntando; el ideal se refiere más a otras ocasiones.</desc><rect width="1500" height="3133" fill="#ffffff"/><text x="44" y="52" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#142f43" font-weight="700">E05 · Acordar lo necesario y decidir en destino</text><text x="44" y="89" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203340" font-weight="400">De la decisión y lo disponible al conocimiento necesario · N01 1.0</text><rect x="44" y="119" width="1412" height="139" rx="12" fill="#e7f2ed"/><text x="68" y="152" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">SUFICIENCIA Y LÍMITE DEL CASO</text><text x="68" y="187" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Sabía lo necesario para empezar; desconocer libro y segunda parada era parte del propósito y acuerdo. La tarde</text><text x="68" y="214" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">funcionó mirando y preguntando; el ideal se refiere más a otras ocasiones.</text><text x="44" y="322" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N025 · Acuerdo y condiciones mínimas para encontrarse</text><text x="44" y="364" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="384" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="417" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="452" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Concretar la salida y precisar el encuentro dejando abierto lo que no impide empezar</text><rect x="44" y="512" width="694.0" height="193" rx="12" fill="#edf3f6"/><text x="68" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Mensajes mientras revisaba pendientes, recuerdo de</text><text x="68" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">librería, horario de su página con margen al cierre,</text><text x="68" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">acuerdo y reconfirmación; avisó al entrar cerca de la</text><text x="68" y="661" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">entrada.</text><rect x="762.0" y="512" width="694.0" height="139" rx="12" fill="#f4eff9"/><text x="786.0" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No faltó trayecto preciso o cafetería elegida. No sabe</text><text x="786.0" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué consultó su amistad.</text><text x="64" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="757" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="825" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cuándo ambas personas pueden, dónde se encontrarán, apertura publicada de la librería y tiempo propio disponible</text><rect x="44" y="885" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="918" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K025</text><text x="68" y="953" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede identificar qué habría impedido iniciar y qué quedó abierto por acuerdo; el aviso precisa dónde encontrarse</text><text x="68" y="980" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">sin suponer traslado de sede.</text><text x="44" y="1064" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E05 · Habilita que el plan ocurra: coincidencia, punto, apertura y tiempo son indispensables</text><text x="44" y="1089" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">para empezar; conocer títulos o el segundo lugar no lo era.</text><text x="44" y="1127" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0271, N01-V0272, N01-V0273, N01-V0274, N01-V0275, N01-V0276, N01-V0277, N01-V0278, N01-V0279, N01-V0280,</text><text x="44" y="1150" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0281, N01-V0282, N01-V0283, N01-V0284, N01-V0285, N01-V0286, N01-V0287, N01-V0288, N01-V0289, N01-V0290</text><path d="M44 1182 H1456" stroke="#c9d5dd"/><text x="44" y="1245" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N028 · Condiciones presentes para seguir conversando</text><text x="44" y="1287" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="1307" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="1340" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="1375" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Quedarse a tomar algo o continuar caminando o terminar la salida</text><rect x="44" y="1435" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="1468" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="1503" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Al salir renovaron ganas de conversar, caminaron</text><text x="68" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cerca, miraron oferta y mesa, preguntaron si podían</text><text x="68" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">usarla y escucharon el ambiente.</text><rect x="762.0" y="1435" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="1468" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="1503" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No faltó anticipación del segundo lugar; esa tarde</text><text x="786.0" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">encontraron dónde conversar y no tuvieron que</text><text x="786.0" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cambiarse.</text><text x="64" y="1636" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="1636" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="1653" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="1686" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="1721" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">si ambas personas quieren y pueden seguir, hay una opción cercana sin otro traslado, una mesa utilizable y</text><text x="68" y="1748" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">ambiente donde se escuchen</text><rect x="44" y="1808" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="1841" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K028</text><text x="68" y="1876" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">La decisión se explica con voluntad renovada y condiciones presentes; mesa visible no se trata como autorización</text><text x="68" y="1903" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">de uso hasta preguntar.</text><text x="44" y="1987" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E05 · Solo se activa al decidir continuar, pero entonces mesa y posibilidad de escucharse</text><text x="44" y="2012" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">determinan si cumple el propósito. No bloqueaba ir a librería.</text><text x="44" y="2050" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0316, N01-V0317, N01-V0303, N01-V0318, N01-V0319, N01-V0320, N01-V0321, N01-V0322, N01-V0323, N01-V0304,</text><text x="44" y="2073" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0289, N01-V0290</text><path d="M44 2105 H1456" stroke="#c9d5dd"/><text x="44" y="2168" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#6b4ca5" font-weight="700">N01-N029 · Referencia recordable para proponer dónde conversar</text><text x="44" y="2210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6b4ca5" font-weight="700">DESEO_IDEAL · NO_APLICA_AL_IDEAL</text><rect x="44" y="2230" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="2263" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="2298" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Proponer o descartar hacia dónde caminar en otra ocasión, comprobando el estado al llegar</text><rect x="44" y="2358" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="2391" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="2426" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Esta salida se resolvió mirando y preguntando. No se</text><text x="68" y="2453" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">documenta una nota existente ni el motivo concreto de</text><text x="68" y="2480" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">una opción guardada.</text><rect x="762.0" y="2358" width="694.0" height="193" rx="12" fill="#f4eff9"/><text x="786.0" y="2391" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="2426" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Desea notas breves propias o ajenas con observaciones</text><text x="786.0" y="2453" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">de escucha, mesas y momento; primero entender por qué</text><text x="786.0" y="2480" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">guardó el lugar. Una lista propia bastaría; mapa si no</text><text x="786.0" y="2507" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">lo ubica.</text><text x="64" y="2586" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><text x="782.0" y="2586" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><rect x="44" y="2603" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="2636" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="2671" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué se observó en un lugar, cuándo y por quién, cómo encontrarlo y por qué se guardaría como opción para conversar</text><rect x="44" y="2731" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="2764" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K029</text><text x="68" y="2799" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede proponer o descartar con una razón recuperada y al llegar encontrar condiciones parecidas a lo entendido,</text><text x="68" y="2826" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">admitiendo diferencia y posibilidad de seguir de largo.</text><text x="44" y="2910" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">Prioridad ALTA · ámbito E05 · La persona prioriza indicios de poder escucharse dentro de ese ideal, con mesa actual a</text><text x="44" y="2935" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">comprobar. El análisis la conserva como exploración opcional; no antecede obligatoriamente cada salida.</text><text x="44" y="2973" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0328, N01-V0329, N01-V0330, N01-V0324, N01-V0331, N01-V0332, N01-V0333, N01-V0334, N01-V0335, N01-V0336,</text><text x="44" y="2996" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0337, N01-V0338, N01-V0339, N01-V0340, N01-V0341, N01-V0342, N01-V0343, N01-V0325</text><path d="M44 3028 H1456" stroke="#c9d5dd"/><text x="44" y="3073" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Fuente: N01_necesidades_v1.json. Selección de decisiones; detalle y contraevidencia en JSON/CSV.</text><text x="44" y="3101" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Flechas = relación analítica. No son flujo de producto. Prioridad local; utilidad y aceptación no comprobadas.</text></svg>