<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3110" viewBox="0 0 1500 3110" role="img"><title>Comparar salidas y acotar afirmaciones</title><desc>Secuencia reconocida y notas concordantes bastan para describir y corregir tiempos con orígenes diferentes. No bastan para hábito semanal o explicación exhaustiva de elección. La falta declarada de alternativas limita esa afirmación, no todo el trabajo.</desc><rect width="1500" height="3110" fill="#ffffff"/><text x="44" y="52" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#142f43" font-weight="700">E02 · Comparar salidas y acotar afirmaciones</text><text x="44" y="89" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203340" font-weight="400">De la decisión y lo disponible al conocimiento necesario · N01 1.0</text><rect x="44" y="119" width="1412" height="166" rx="12" fill="#e7f2ed"/><text x="68" y="152" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">SUFICIENCIA Y LÍMITE DEL CASO</text><text x="68" y="187" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Secuencia reconocida y notas concordantes bastan para describir y corregir tiempos con orígenes diferentes. No</text><text x="68" y="214" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">bastan para hábito semanal o explicación exhaustiva de elección. La falta declarada de alternativas limita esa</text><text x="68" y="241" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">afirmación, no todo el trabajo.</text><text x="44" y="349" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N006 · Unidad y relaciones que hacen comparables las salidas</text><text x="44" y="391" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="411" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="444" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="479" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Elegir qué unidades puede comparar sin equiparar tiempos de recorridos distintos</text><rect x="44" y="539" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="572" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Notas, reconstrucción posterior, conversación,</text><text x="68" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">esquemas y mapa permitieron distinguir visita-compra</text><text x="68" y="661" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">de comprar-volver; se corrigió la comparación inicial.</text><rect x="762.0" y="539" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="572" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No se necesitó toda la semana para corregir la unidad.</text><text x="786.0" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No todas las razones se redujeron a una categoría</text><text x="786.0" y="661" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">única.</text><text x="64" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="740" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="757" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="825" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué actividades integra cada salida, desde dónde empieza, para qué se compra y cómo importan tiempo y posición</text><text x="68" y="852" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">relativa</text><rect x="44" y="912" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="945" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K006</text><text x="68" y="980" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede mostrar por qué dos tiempos no son equivalentes y qué comparación acotada sí sostendría; conserva la función</text><text x="68" y="1007" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">temporal y casos simples.</text><text x="44" y="1091" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E02 · Define qué se está comparando; evita que una escala de tiempos o proximidad borre</text><text x="44" y="1116" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">diferencias que cambiaron la lectura.</text><text x="44" y="1154" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0044, N01-V0045, N01-V0046, N01-V0047, N01-V0048, N01-V0049, N01-V0050, N01-V0051, N01-V0052, N01-V0053,</text><text x="44" y="1177" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0054</text><path d="M44 1209 H1456" stroke="#c9d5dd"/><text x="44" y="1272" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N008 · Alternativas conocidas y posibles antes de explicar una elección</text><text x="44" y="1314" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · CARENCIA_DECLARADA</text><rect x="44" y="1334" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="1367" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="1402" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Elegir entre limitarse a describir el recorrido o sostener una explicación de elección respaldada</text><rect x="44" y="1462" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="1495" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Una objeción del grupo mostró que no habían</text><text x="68" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">reconstruido todas las alternativas; habían avanzado</text><text x="68" y="1584" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">más en describir recorridos.</text><rect x="762.0" y="1462" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="1495" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="1530" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Carencia declarada de reconstrucción completa de</text><text x="786.0" y="1557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">alternativas para esa explicación más amplia; no</text><text x="786.0" y="1584" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">invalida la descripción realizada.</text><text x="64" y="1663" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="1663" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="1680" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="1713" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="1748" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué alternativas de compra conocía la persona y cuáles eran posibles en la ocasión que se pretende explicar</text><rect x="44" y="1808" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="1841" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K008</text><text x="68" y="1876" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">La lectura distingue recorrido realizado de elección entre opciones y señala cuáles alternativas quedan sin</text><text x="68" y="1903" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">conocer antes de generalizar.</text><text x="44" y="1987" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad MEDIA · ámbito E02 · Solo es indispensable si se pretende explicar elección entre alternativas; la salida y</text><text x="44" y="2012" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">el texto acotados pudieron describirse sin resolverlo todo.</text><text x="44" y="2050" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0078, N01-V0079, N01-V0080, N01-V0081, N01-V0082, N01-V0072</text><path d="M44 2082 H1456" stroke="#c9d5dd"/><text x="44" y="2145" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#6b4ca5" font-weight="700">N01-N009 · Contraste de una segunda ocasión del mismo caso</text><text x="44" y="2187" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6b4ca5" font-weight="700">DESEO_IDEAL · NO_APLICA_AL_IDEAL</text><rect x="44" y="2207" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="2240" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="2275" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Precisar la unidad de comparación, revisar una preferencia aparentemente estable y decidir si merece seguimiento</text><rect x="44" y="2335" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="2368" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="2403" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">El ejercicio relata una salida detallada y recuerdos</text><text x="68" y="2430" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">de otras; las herramientas actuales bastaron, sin</text><text x="68" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">acreditar repetición semanal.</text><rect x="762.0" y="2335" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="2368" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="2403" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Desea primero una segunda ocasión contrastante antes</text><text x="786.0" y="2430" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">que un periodo entero; el cuaderno tendría secuencia,</text><text x="786.0" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">palabras y desconocidos.</text><text x="64" y="2536" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><text x="782.0" y="2536" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><rect x="44" y="2553" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="2586" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="2621" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">cómo varían propósito, actividades, lugares, tiempo y carga entre dos ocasiones que la propia persona considere</text><text x="68" y="2648" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">distintas</text><rect x="44" y="2708" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="2741" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K009</text><text x="68" y="2776" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Al comparar primera y segunda ocasión puede precisar una afirmación o reducir su alcance; también puede concluir</text><text x="68" y="2803" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">que el seguimiento no aporta.</text><text x="44" y="2887" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">Prioridad ALTA · ámbito E02 · Ella prioriza el contraste acotado frente al periodo entero; el análisis mantiene esa</text><text x="44" y="2912" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">precedencia para explorar el ideal y deja incierta su viabilidad.</text><text x="44" y="2950" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0083, N01-V0084, N01-V0080, N01-V0085, N01-V0086, N01-V0087, N01-V0088, N01-V0089, N01-V0090, N01-V0091,</text><text x="44" y="2973" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0092, N01-V0093, N01-V0094, N01-V0095, N01-V0096, N01-V0070, N01-V0097</text><path d="M44 3005 H1456" stroke="#c9d5dd"/><text x="44" y="3050" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Fuente: N01_necesidades_v1.json. Selección de decisiones; detalle y contraevidencia en JSON/CSV.</text><text x="44" y="3078" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Flechas = relación analítica. No son flujo de producto. Prioridad local; utilidad y aceptación no comprobadas.</text></svg>