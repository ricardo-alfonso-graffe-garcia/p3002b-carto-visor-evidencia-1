<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3087" viewBox="0 0 1500 3087" role="img"><title>Revisar sin confundir sitio y acceso</title><desc>P109 y P157: suficiente para la tarea relatada. No saber otro acceso no fue carencia de ese encargo. La condición futura requiere una petición distinta.</desc><rect width="1500" height="3087" fill="#ffffff"/><text x="44" y="52" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#142f43" font-weight="700">E01 · Revisar sin confundir sitio y acceso</text><text x="44" y="89" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203340" font-weight="400">De la decisión y lo disponible al conocimiento necesario · N01 1.0</text><rect x="44" y="119" width="1412" height="139" rx="12" fill="#e7f2ed"/><text x="68" y="152" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">SUFICIENCIA Y LÍMITE DEL CASO</text><text x="68" y="187" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">P109 y P157: suficiente para la tarea relatada. No saber otro acceso no fue carencia de ese encargo. La condición</text><text x="68" y="214" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">futura requiere una petición distinta.</text><text x="44" y="322" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#126b73" font-weight="700">N01-N002 · Identidad del espacio y sentido de la diferencia de acceso</text><text x="44" y="364" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#126b73" font-weight="700">NECESIDAD_ACTUAL · ATENDIDA_EN_EPISODIO</text><rect x="44" y="384" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="417" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="452" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Conservar el registro y su punto o detener una modificación para aclarar otra identidad</text><rect x="44" y="512" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Nombre, descripción anterior, esquina del croquis y</text><text x="68" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">respuesta mediada del equipo coincidieron; conservó</text><text x="68" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">identificador y punto y ajustó el acceso.</text><rect x="762.0" y="512" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">No faltó información para esta decisión; la otra</text><text x="786.0" y="607" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">puerta permaneció sin comprobar y no era requisito de</text><text x="786.0" y="634" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">esta revisión.</text><text x="64" y="713" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><text x="782.0" y="713" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#126b73" font-weight="700">↓</text><rect x="44" y="730" width="1412" height="112" rx="12" fill="#e9f4f5"/><text x="68" y="763" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="798" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">si las referencias describen el mismo espacio y si cambió el acceso, la descripción o la localización</text><rect x="44" y="858" width="1412" height="112" rx="12" fill="#f4f6f8"/><text x="68" y="891" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K002</text><text x="68" y="926" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Puede justificar conservar el punto y precisar la descripción sin afirmar acceso único o cierre de otra puerta.</text><text x="44" y="1010" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">Prioridad ALTA · ámbito E01 · La identidad y lo representado determinan acciones diferentes. La coincidencia aparente</text><text x="44" y="1035" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#126b73" font-weight="400">no bastaba; la aclaración sí resolvió la duda.</text><text x="44" y="1073" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0006, N01-V0007, N01-V0008, N01-V0009, N01-V0010, N01-V0011, N01-V0012, N01-V0013</text><path d="M44 1105 H1456" stroke="#c9d5dd"/><text x="44" y="1168" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#6b4ca5" font-weight="700">N01-N004 · Explicación recuperable del último cambio pertinente</text><text x="44" y="1210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6b4ca5" font-weight="700">DESEO_IDEAL · NO_APLICA_AL_IDEAL</text><rect x="44" y="1230" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="1263" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="1298" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Decidir al retomar un registro si puede usarlo o requiere una nueva aclaración</text><rect x="44" y="1358" width="694.0" height="193" rx="12" fill="#edf3f6"/><text x="68" y="1391" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="1426" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Parte de las notas por registro ya existe. En otras</text><text x="68" y="1453" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">ocasiones expresiones como revisado o cambio de</text><text x="68" y="1480" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">ubicación no explican qué se comprobó; este episodio</text><text x="68" y="1507" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">se atendió.</text><rect x="762.0" y="1358" width="694.0" height="166" rx="12" fill="#f4eff9"/><text x="786.0" y="1391" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="1426" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Desea una explicación encontrada de manera más pareja,</text><text x="786.0" y="1453" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">empezando por el último cambio que afecta identificar</text><text x="786.0" y="1480" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">el lugar, sin reunir mensajes irrelevantes.</text><text x="64" y="1586" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><text x="782.0" y="1586" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b4ca5" font-weight="700">↓</text><rect x="44" y="1603" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="1636" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="1671" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué cambió en la identificación del lugar, por qué, con qué respaldo, a qué revisión corresponde y qué duda</text><text x="68" y="1698" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">pertinente sigue abierta</text><rect x="44" y="1758" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="1791" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K004</text><text x="68" y="1826" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Al retomar un lugar puede explicar la revisión sin depender del recuerdo de la conversación; otra compañera</text><text x="68" y="1853" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">identifica la duda que quedó.</text><text x="44" y="1937" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">Prioridad ALTA · ámbito E01 · Es la primera pieza que ella elige en el ideal frente a reunir muchos materiales; el</text><text x="44" y="1962" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#6b4ca5" font-weight="400">análisis la conserva como candidata prioritaria para retomar revisiones, no como fallo pasado.</text><text x="44" y="2000" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0028, N01-V0029, N01-V0030, N01-V0031, N01-V0032, N01-V0033, N01-V0034, N01-V0035, N01-V0036, N01-V0037,</text><text x="44" y="2023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">N01-V0038</text><path d="M44 2055 H1456" stroke="#c9d5dd"/><text x="44" y="2118" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#9a6015" font-weight="700">N01-N005 · Condiciones de acceso para una petición futura específica</text><text x="44" y="2160" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#9a6015" font-weight="700">INFERENCIA_ANALITICA_CONDICIONAL · NO_DETERMINABLE</text><rect x="44" y="2180" width="1412" height="112" rx="12" fill="#edf3f6"/><text x="68" y="2213" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">DECISIÓN</text><text x="68" y="2248" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Determinar si bastan las referencias existentes o debe pedir una confirmación adicional antes de indicar ingreso</text><rect x="44" y="2308" width="694.0" height="166" rx="12" fill="#edf3f6"/><text x="68" y="2341" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">INFORMACIÓN ACTUAL</text><text x="68" y="2376" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Solo consta el acceso utilizado en el recorrido;</text><text x="68" y="2403" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">desconoce la otra puerta, horarios y condiciones de</text><text x="68" y="2430" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">una siguiente visita.</text><rect x="762.0" y="2308" width="694.0" height="193" rx="12" fill="#f4eff9"/><text x="786.0" y="2341" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">FALTA / DESEO Y CONDICIONES</text><text x="786.0" y="2376" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">El análisis conserva como necesidad condicional la</text><text x="786.0" y="2403" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">confirmación pertinente únicamente si una solicitud</text><text x="786.0" y="2430" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">futura exige indicar ingreso bajo condiciones</text><text x="786.0" y="2457" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">específicas.</text><text x="64" y="2536" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#9a6015" font-weight="700">↓</text><text x="782.0" y="2536" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#9a6015" font-weight="700">↓</text><rect x="44" y="2553" width="1412" height="139" rx="12" fill="#e9f4f5"/><text x="68" y="2586" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">NECESIDAD DE INFORMACIÓN FORMULADA</text><text x="68" y="2621" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">qué acceso puede usarse y bajo qué horarios o condiciones para una actividad específica, si la nueva petición lo</text><text x="68" y="2648" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">exige</text><rect x="44" y="2708" width="1412" height="139" rx="12" fill="#f4f6f8"/><text x="68" y="2741" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#365166" font-weight="700">COMPROBACIÓN PROPUESTA · N01-K005</text><text x="68" y="2776" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">Ante una solicitud que sí requiera condiciones de ingreso, se identifica qué condición no está respaldada y se</text><text x="68" y="2803" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#203340" font-weight="400">deja pendiente en vez de asegurarla.</text><text x="44" y="2887" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#9a6015" font-weight="400">Prioridad PENDIENTE · ámbito E01 · No hay una actividad futura concreta comparable: se activa solo si cambia el</text><text x="44" y="2912" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#9a6015" font-weight="400">propósito. La incógnita no bloqueó el episodio.</text><text x="44" y="2950" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Evidencias: N01-V0019, N01-V0011, N01-V0016, N01-V0017</text><path d="M44 2982 H1456" stroke="#c9d5dd"/><text x="44" y="3027" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Fuente: N01_necesidades_v1.json. Selección de decisiones; detalle y contraevidencia en JSON/CSV.</text><text x="44" y="3055" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203340" font-weight="400">Flechas = relación analítica. No son flujo de producto. Prioridad local; utilidad y aceptación no comprobadas.</text></svg>